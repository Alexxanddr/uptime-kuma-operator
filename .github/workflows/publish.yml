name: Publish Docker image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest --cov --cov-report=xml
      - run: RUN_KUMA_INTEGRATION=1 pytest tests/test_integration.py
      - run: RUN_KUMA_INTEGRATION=1 KUMA_TEST_IMAGE=louislam/uptime-kuma:1.23.16 pytest tests/test_integration.py
      - run: RUN_KUMA_INTEGRATION=1 KUMA_TEST_IMAGE=louislam/uptime-kuma:2.5.8 pytest tests/test_integration.py
      - run: RUN_KUMA_INTEGRATION=1 KUMA_TEST_IMAGE=louislam/uptime-kuma:2.5.9 pytest tests/test_integration.py
      - run: pip-audit -r requirements.txt --no-deps --disable-pip
      - run: python scripts/validate_manifests.py
      - run: python -m build
      - run: docker build --check . && docker build -t kumaops:release .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: kumaops:release
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: |
          kind create cluster --name kumaops-release --kubeconfig "$RUNNER_TEMP/kumaops.kubeconfig"
      - run: python scripts/e2e.py --run
        env:
          KUBECONFIG: ${{ runner.temp }}/kumaops.kubeconfig
      - if: always()
        run: kind delete cluster --name kumaops-release
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
