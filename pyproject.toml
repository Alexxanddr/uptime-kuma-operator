[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kumaops-operator"
version = "1.1.0"
description = "Annotation-driven Kubernetes controller for Uptime Kuma monitors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alessandro Sottile"}]
keywords = ["kubernetes", "uptime-kuma", "kopf", "monitoring"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/Alexxanddr/uptime-kuma-operator"
Issues = "https://github.com/Alexxanddr/uptime-kuma-operator/issues"
Documentation = "https://github.com/Alexxanddr/uptime-kuma-operator/tree/main/docs"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["kuma_operator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: isolated live Kuma", "e2e: isolated Kubernetes namespace and Kuma"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["kuma_operator"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
